# Applies new migrations in supabase/migrations to a Supabase project. Run it by hand from the
# Actions tab and pick the environment. Needs, per GitHub environment ("test", later "live"):
#   secrets.SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access tokens)
#   secrets.SUPABASE_DB_PASSWORD   (the project's database password)
#   vars.SUPABASE_PROJECT_ID
name: Deploy database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which Supabase project
        type: choice
        options: [test]
        default: test

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      - run: supabase db push
      - run: supabase functions deploy delete-account --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
